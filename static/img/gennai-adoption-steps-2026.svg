<text x="923" y="370">未利用の理由を</text><text x="923" y="399">聞き取り見直す</text></g>
<text x="58" y="488" fill="#a7b8d4" font-size="17">※この手順はデジタル庁の公式推奨ではなく、AIの鬼編集部による実務提案です。</text>
<text x="1148" y="488" fill="#ff83c1" text-anchor="end" font-size="18" font-weight="700">ai-oni.com</text>
