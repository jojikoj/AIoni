<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
<title id="t">中小企業の生成AI定着：4週間の検証サイクル</title><desc id="d">業務を絞る、導入前に測る、AI利用と修正時間を記録する、継続と研修を判断するという4段階の流れ</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1528"/><stop offset="1" stop-color="#2c113a"/></linearGradient></defs>
<rect width="1200" height="540" fill="url(#bg)"/>
<g font-family="'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif">
<text x="58" y="75" fill="#ff83c1" font-size="24" font-weight="700">AIの鬼 / 現場で試す</text>
<text x="58" y="137" fill="#fff" font-size="39" font-weight="800">AI導入を「使われる仕組み」にする4週間</text>
<text x="58" y="175" fill="#bfcbe2" font-size="21">小さく始め、実利用・時間・品質を測る</text>
<g fill="#1d2943" stroke="#84619f" stroke-width="2">
<rect x="50" y="222" width="257" height="209" rx="24"/>
<rect x="332" y="222" width="257" height="209" rx="24"/>
<rect x="614" y="222" width="257" height="209" rx="24"/>
<rect x="896" y="222" width="257" height="209" rx="24"/>
</g>
<g font-size="28" font-weight="800" fill="#ff9dd0">
<text x="77" y="275">STEP 1</text><text x="359" y="275">STEP 2</text><text x="641" y="275">STEP 3</text><text x="923" y="275">STEP 4</text></g>
<g font-size="25" font-weight="700" fill="#fff">
<text x="77" y="327">業務を3つ選ぶ</text>
<text x="359" y="327">導入前に計測</text>
<text x="641" y="327">AIで実施・記録</text>
<text x="923" y="327">継続・改善判断</text></g>
<g font-size="18" fill="#cbd4ea">
<text x="77" y="370">担当者と対象作業</text><text x="77" y="399">を決める</text>
<text x="359" y="370">従来の完了時間</text><text x="359" y="399">と品質を確認</text>
